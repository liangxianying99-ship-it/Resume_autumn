<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋招 · 投递手账</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20342b;background:#f5f6f0}body{max-width:1240px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;margin-bottom:8px}p{color:#627269}button,input,select,textarea{font:inherit;border:1px solid #d5ddd4;border-radius:9px;padding:10px}button{background:#245b42;color:white;cursor:pointer}button.secondary{color:#245b42;background:white}.stats{display:flex;gap:16px;margin:28px 0}.stat{background:white;border:1px solid #e2e6dc;padding:20px;flex:1;border-radius:14px}.stat b{display:block;font-size:30px}nav{display:flex;gap:12px;margin-bottom:20px}nav input{flex:1}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:18px 14px;border-bottom:1px solid #eef0e9}th{color:#627269;font-weight:500;font-size:13px}td:nth-child(3){max-width:420px}.pill{background:#eaf2e7;border-radius:20px;padding:6px 12px;font-size:13px;display:inline-block}.muted{font-size:13px;color:#627269}dialog{border:0;border-radius:16px;width:min(640px,85vw);padding:28px}dialog::backdrop{background:#10271d88}label{display:block;margin-top:14px}label input,label textarea,label select{box-sizing:border-box;width:100%;margin-top:6px}textarea{min-height:160px}footer{margin:26px 0;font-size:13px;color:#627269}#error{color:#a23131}details{background:white;padding:15px;border-radius:12px;margin:20px 0}#token{overflow-wrap:anywhere}a{color:#245b42}@media(max-width:700px){header,nav{flex-wrap:wrap}.stats{gap:6px}.stat{padding:12px}table{font-size:13px}th,td{padding:10px 5px}body{padding:0 10px}}
</style>
<header><div><div class="muted">CAREER JOURNAL / 2027</div><h1>秋招投递手账</h1><p>每一次尝试，都有迹可循。</p></div><div><input id="importFile" type="file" accept=".xlsx,.csv,.json" hidden><button class="secondary" id="import">导入表格</button> <button class="secondary" id="backup">备份 JSON</button> <button class="secondary" id="export">导出 CSV</button> <button id="add">＋ 记录岗位</button></div></header>
<div class="stats"><div class="stat">全部记录<b id="total">0</b></div><div class="stat">待确认<b id="pending">0</b></div><div class="stat">面试 / 测评中<b id="active">0</b></div></div>
<nav><input id="search" placeholder="搜索公司、岗位或 JD" aria-label="搜索"><select id="filter" aria-label="筛选进度"><option value="">全部进度</option></select></nav><p id="error" role="alert"></p>
<div style="overflow-x:auto"><table><thead><tr><th>投递时间</th><th>公司</th><th>岗位</th><th>进度</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>

<footer>记录保存在当前 Chrome 配置中，不上传云端。卸载插件会清除数据，请定期导出备份。</footer>
<dialog id="editor"><form id="form"><h2 id="title">记录岗位</h2><input type="hidden" name="id"><label>投递时间<input name="applied_at" type="text" placeholder="2026-10-11"></label><label>公司<input name="company" required></label><label>岗位<input name="role" required></label><label>进度<input name="status" list="statuses" required></label><datalist id="statuses"><option>待确认</option><option>已投递</option><option>简历筛选</option><option>测评</option><option>笔试</option><option>面试</option><option>Offer</option><option>已拒绝</option><option>已撤回</option></datalist><label>岗位链接<input name="url" type="url"></label><label>完整 JD<textarea name="jd"></textarea></label><input type="hidden" name="source"><p id="formError" role="alert"></p><p><button type="submit">保存记录</button> <button type="button" class="secondary" id="close">取消</button></p></form></dialog>
<script src="import.js"></script><script src="dashboard.js"></script></html>
